<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafePark SP - Estacione com Segurança</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --success: #22c55e;
            --warning: #eab308;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--card-bg);
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            background-color: var(--accent);
            color: #0f172a;
            font-weight: bold;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-size: 18px;
        }

        h1 {
            font-size: 18px;
            font-weight: 600;
        }

        .container {
            padding: 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #334155;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .card-title {
            font-size: 14px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn {
            background-color: var(--accent);
            color: #0f172a;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 10px;
        }

        .btn:active {
            opacity: 0.8;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: var(--text-primary);
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .status-box {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            background-color: #0f172a;
            border-left: 4px solid var(--accent);
            display: none;
        }

        .status-box.safe { border-left-color: var(--success); }
        .status-box.warning { border-left-color: var(--warning); }
        .status-box.danger { border-left-color: var(--danger); }

        .location-name {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .risk-text {
            font-size: 14px;
            color: var(--text-secondary);
        }

        nav {
            background-color: var(--card-bg);
            display: flex;
            justify-content: space-around;
            padding: 12px;
            border-top: 1px solid #334155;
        }

        .nav-item {
            text-align: center;
            color: var(--text-secondary);
            font-size: 12px;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .nav-item.active {
            color: var(--accent);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="logo-icon">P</div>
            <h1>SafePark SP</h1>
        </div>
        <div style="font-size: 13px; color: var(--text-secondary);">MVP v1.0</div>
    </header>

    <div class="container">
        
        <!-- Bloco 1: Uso Automático via GPS -->
        <div class="card">
            <div class="card-title">📍 Localização Atual (GPS)</div>
            <button class="btn" onclick="ativarGPS()">Ativar GPS Local</button>
            
            <div id="gps-status" class="status-box">
                <div id="gps-endereco" class="location-name">Buscando endereço...</div>
                <div id="gps-risco" class="risk-text">Analisando índice de segurança na região...</div>
            </div>
        </div>

        <!-- Bloco 2: Modo Planejamento por Endereço -->
        <div class="card">
            <div class="card-title">🔍 Planejar Destino Antecipado</div>
            <div class="input-group">
                <label for="destino" style="font-size: 13px; color: var(--text-secondary);">Digite o endereço ou local em SP:</label>
                <input type="text" id="destino" placeholder="Ex: Av. Paulista, 1000 - São Paulo">
            </div>
            <button class="btn" style="background-color: #334155; color: var(--text-primary);" onclick="planejarDestino()">Analisar Destino</button>
            
            <div id="planejamento-status" class="status-box">
                <div id="plan-endereco" class="location-name">Nenhum destino planejado</div>
                <div id="plan-risco" class="risk-text">Digite um endereço acima para consultar o histórico.</div>
            </div>
        </div>

    </div>

    <nav>
        <a href="#" class="nav-item active">
            <span>🏠</span>
            <span>Início</span>
        </a>
        <a href="#" class="nav-item" onclick="alert('Módulo de mapa interativo em desenvolvimento para o próximo ciclo.')">
            <span>🗺️</span>
            <span>Mapa</span>
        </a>
        <a href="#" class="nav-item" onclick="alert('SafePark - Ferramenta gratuita para teste em campo.')">
            <span>💎</span>
            <span>Sobre</span>
        </a>
    </nav>

    <script>
        // Função simulada de Geocodificação Reversa e MME para testes na rua
        function ativarGPS() {
            const statusBox = document.getElementById('gps-status');
            const endEl = document.getElementById('gps-endereco');
            const riscoEl = document.getElementById('gps-risco');
            
            statusBox.style.display = 'block';
            endEl.innerText = "Obtendo sinal de GPS...";
            riscoEl.innerText = "Aguarde a leitura das coordenadas...";

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(async (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    
                    try {
                        // Utilizando Nominatim (OpenStreetMap) para geocodificação reversa gratuita
                        const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`);
                        const data = await response.json();
                        
                        const rua = data.address.road || data.address.suburb || "Localização atual em São Paulo";
                        const bairro = data.address.suburb || data.address.city_district || "Zona urbana";
                        
                        endEl.innerText = `📍 ${rua}, ${bairro}`;
                        
                        // Simulação baseada na MME (Média Móvel Exponencial de Furtos/Roubos)
                        statusBox.className = "status-box warning";
                        riscoEl.innerHTML = "⚠️ <strong>Zona de Atenção (MME Moderada)</strong><br>Histórico de 4 furtos de veículos nos últimos 6 meses num raio de 120m. Evite deixar objetos à vista.";
                    } catch (error) {
                        endEl.innerText = `Coordenadas: ${lat.toFixed(4)}, ${lon.toFixed(4)}`;
                        riscoEl.innerText = "Não foi possível traduzir o endereço exato, mas a área foi mapeada.";
                        statusBox.className = "status-box safe";
                    }
                }, (error) => {
                    statusBox.style.display = 'block';
                    endEl.innerText = "Erro no GPS";
                    riscoEl.innerText = "Ative a permissão de localização no seu navegador.";
                    statusBox.className = "status-box danger";
                });
            } else {
                alert("Geolocalização não é suportada pelo seu navegador.");
            }
        }

        function planejarDestino() {
            const inputDestino = document.getElementById('destino').value;
            const statusBox = document.getElementById('planejamento-status');
            const endEl = document.getElementById('plan-endereco');
            const riscoEl = document.getElementById('plan-risco');

            if (!inputDestino.trim()) {
                alert("Por favor, digite um endereço válido para planejar.");
                return;
            }

            statusBox.style.display = 'block';
            endEl.innerText = `🎯 Destino: ${inputDestino}`;
            
            // Simulação de resposta da MME para o destino planejado
            statusBox.className = "status-box danger";
            riscoEl.innerHTML = "🚨 <strong>Alto Risco Histórico (MME Elevada)</strong><br>Foram registrados índices expressivos de roubo de veículos e transeuntes nas quadras ao redor deste destino. Recomenda-se estacionamento privado a até 150m.";
        }
    </script>
</body>
</html>
